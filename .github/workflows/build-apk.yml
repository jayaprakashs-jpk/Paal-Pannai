name: Build Android APK

# Builds an installable .apk on GitHub's own runners. No Expo account needed.
# Download it from: Actions tab -> the run -> Artifacts -> nammoor-pannai-apk
on:
  push:
    branches: [claude/livestock-management-app-gjripf, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional. Leave the secrets empty to build the offline-only app.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TILE_URL: ${{ secrets.EXPO_PUBLIC_TILE_URL }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Typecheck and tests
        run: npm run verify
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk nammoor-pannai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nammoor-pannai-apk
          path: nammoor-pannai.apk
          if-no-files-found: error
